# SMTP usado pelo commons-email. Credenciais devem ser informadas por variável de ambiente.
mail.host=${MAIL_HOST:email-smtp.us-east-1.amazonaws.com}
mail.port=${MAIL_PORT:465}
mail.username=${MAIL_USER:}
mail.password=${MAIL_PASS:}
mail.starttls=${MAIL_STARTTLS:true}
mail.ssl=${MAIL_SSL:true}
mail.from=${MAIL_FROM:suporte_sgi@copony.com.br}
mail.debug=${MAIL_DEBUG:false}
# Durante testes/ajustes, todo e-mail é redirecionado para este endereço. Deixar vazio apenas em produção.
mail.redirect-to=${MAIL_REDIRECT_TO:eavilalima@gmail.com}
