#
# Isolated app configuration
#
# Possible values for category: * (any), message, command, event
# Format for queue.name: similar to a URI, e.g. [SCOPE|PROTOCOL]:[HOSTNAME|APPNAME]/[EXECUTOR_NAME]
# node-name accepts an empty name. In such a case, the node name will be detected automatically by
# NodeNameProvider when needed (by default, in SpringNodeNameProvider, the node name is the server's hostname).
#
fasolti.jobs.node-name=${APP_NODENAME:}
fasolti.jobs.amqp.declaring=${MQ_DECLARING:@mq.declaring@}
fasolti.jobs.default-executor.queue.name=${MQ_QUEUE:jobs-exec:fasolti.sgi/default}
fasolti.jobs.default-executor.bindings[0].category=command
fasolti.jobs.default-executor.bindings[0].application=fasolti.sgi
