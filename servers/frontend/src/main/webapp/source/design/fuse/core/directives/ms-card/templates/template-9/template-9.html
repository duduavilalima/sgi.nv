<div class="template-9">
	<div class="header p-16" layout="row" layout-align="start center">
		<div ng-if="card.avatar">
			<img alt="{{card.avatar.alt}}" class="avatar mr-16" ng-src="{{card.avatar.src}}">
		</div>

		<div class="info">
			<div class="title" ng-if="card.title">
				{{card.title}}
			</div>

			<div class="subtitle secondary-text" ng-if="card.subtitle">
				{{card.subtitle}}
			</div>

		</div>
	</div>

	<div class="text ph-16 pb-16" ng-if="card.text">
		{{card.text}}
	</div>

	<div class="media">
		<img alt="{{card.media.image.alt}}" class="image" ng-show="card.media.image" ng-src="{{card.media.image.src}}">
	</div>

	<div class="buttons m-8">
		<md-button aria-label="Favorite" class="md-icon-button mr-16">
			<md-icon class="s24" md-font-icon="icon-heart-outline"></md-icon>
		</md-button>
		<md-button aria-label="Share" class="md-icon-button">
			<md-icon class="s24" md-font-icon="icon-share"></md-icon>
		</md-button>
	</div>

</div>
