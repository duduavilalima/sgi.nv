<div class="template-1">
	<div class="media">
		<img alt="{{card.media.image.alt}}" class="image" ng-show="card.media.image" ng-src="{{card.media.image.src}}"/>
	</div>

	<div class="content pv-24 ph-16">
		<div class="title h1" ng-if="card.title">
			{{card.title}}
		</div>

		<div class="subtitle secondary-text" ng-if="card.subtitle">
			{{card.subtitle}}
		</div>

		<div class="text pt-16" ng-if="card.text">
			{{card.text}}
		</div>
	</div>
</div>
