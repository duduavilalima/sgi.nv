<md-dialog aria-label="{{title}}" id="dialog_titulo_popup_adicionar_lancamento" style="width: 1000px;">
	<md-toolbar class="md-accent-bg">
		<div class="md-toolbar-tools">
			<h2 id="titulo_popup_adicionar_lancamento" md-autofocus> Conciliação Bancária - {{title}} </h2>
			<span flex></span>
			<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
				<md-icon aria-label="Close dialog" md-font-icon="icon-close"
						 style="color: rgba(255,255,255,0.87) !important"></md-icon>
			</md-button>
		</div>
	</md-toolbar>

	<md-dialog-content role="document">
		<div class="md-dialog-content md-dialog-content-body ng-scope">
			<form name="DialogAdicionarLancamentoForm">

				<div layout layout-sm="column">
					<md-input-container flex="25" flex-sm="100" flex-xs="100">
						<label id="lbl_numero">Número</label>
						<input id="input_numero" name="input_numero" ng-disabled="true" ng-model="object.numero"
							   type="text">
					</md-input-container>

					<md-input-container flex="25" flex-sm="100" flex-xs="100">
						<label id="lbl_situacao">Situação</label>
						<input id="input_situacao" name="input_situacao" ng-disabled="true" ng-model="object.situacao"
							   type="text">
					</md-input-container>

					<md-input-container flex="25" flex-sm="100" flex-xs="100">
						<label id="lbl_pagamento">Pagamento</label>
						<input id="input_pagamento" name="input_pagamento" ng-disabled="true" type="text"
							   value="{{object.data | date:'dd/MM/yyyy'}}">
					</md-input-container>

					<md-input-container flex="25" flex-sm="100" flex-xs="100">
						<label id="lbl_empresa">Empresa</label>
						<input id="input_empresa" name="input_empresa" ng-disabled="true" type="text"
							   value="{{object.unidade.codnome}}">
					</md-input-container>
				</div>

				<div layout layout-sm="column">

					<md-input-container flex="20" flex-sm="100" flex-xs="100">
						<label id="lbl_banco">Banco</label>
						<input id="input_banco" name="input_banco" ng-disabled="true" type="text"
							   value="{{object.banco.nome}}">
					</md-input-container>

					<md-input-container flex="60" flex-sm="100" flex-xs="100">
						<label id="lbl_agencia_conta">Agência / conta</label>
						<input id="input_agencia_conta" name="input_agencia_conta" ng-disabled="true" type="text"
							   value="{{agenciaConta}}">
					</md-input-container>

					<md-input-container flex="20" flex-sm="100" flex-xs="100">
						<label id="lbl_valor">Valor</label>
						<input id="input_valor" name="input_valor" ng-disabled="true" ng-model="object.valor"
							   type="text" ui-number-mask="2">
					</md-input-container>

				</div>

				<div layout layout-sm="column">
					<!-- Autocomplete de Conta Contabil-->
					<md-autocomplete flex flex flex-gt-md="80" id="autocomplete_conta_contabil" md-delay="250"
									 md-floating-label="Conta contábil*"
									 md-input-id="input_numero_conta_contabil"
									 md-input-name="autocompleteContaContabil"
									 md-item-text="item.numero + ' - ' + item.descricao"
									 md-items="item in querySearchContaContabil(searchTextContaContabil)"
									 md-menu-class="autocomplete-custom-template"
									 md-min-length="3"
									 md-no-cache="false"
									 md-search-text="searchTextContaContabil"
									 md-selected-item="selectedItemContaContabil"
									 md-selected-item-change="fnSelectedItemContaContabil(item)"
									 name="autocompleteContaContabil">

						<md-item-template>
											<span class="item-title">
												<h3> <strong> <span md-highlight-flags="i"
																	md-highlight-text="searchTextContaContabil"> {{item.numero}} </span> </strong>
												</h3>
											</span>

							<span class="item-title">
												<h5> <strong>NÚMERO: </strong>
													<span md-highlight-flags="i"
														  md-highlight-text="searchTextContaContabil">{{item.numero}} </span>
												</h5>
											</span>

							<span class="item-title">
												<h5> <strong>DESCRIÇÃO: </strong>
													<span md-highlight-flags="i"
														  md-highlight-text="searchTextContaContabil">{{item.descricao}} </span>
												</h5>
											</span>
						</md-item-template>

						<div ng-messages="wizardStep1.autocompleteCliente.$error"
							 ng-show="wizardStep1.autocompleteCliente.$touched" role="alert">
							<div id="msg_req_client" ng-message="required">Obrigatório.</div>
							<div id="msg_min_client" ng-message="minlength">O nome informado não é suficiente.</div>
							<div id="msg_max_client" ng-message="maxlength">O nome informado é muito longo.</div>
						</div>
					</md-autocomplete>

					<md-input-container flex="20" flex-sm="100" flex-xs="100">
						<label id="lbl_debito_credito">Débito/Crédito</label>
						<input id="input_debito_credito" name="input_debito_credito" ng-disabled="true"
							   ng-value="object.debitoCredito == 'D'? 'Débito' : 'Crédito' " type="text">
					</md-input-container>

				</div>

				<div layout layout-sm="column" ng-if="screenMode != 'VIEW'" style="margin-top: -0px">
					<span>*</span>&nbsp;Campos obrigatórios
				</div>

			</form>
		</div>

		<md-divider></md-divider>
	</md-dialog-content>
	<md-dialog-actions layout="row">
		<md-button class="md-raised md-accent" id="btn_salvar" ng-click="confirm()" ng-disabled="action">
			Salvar
		</md-button>
		<md-button class="md-raised md-default" id="btn_cancelar" ng-click="cancel()" ng-disabled="action">
			Cancelar
		</md-button>
		<span flex></span>
	</md-dialog-actions>
</md-dialog>
