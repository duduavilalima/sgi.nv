<div layout layout-sm="column" layout-wrap style="margin-top: 0px;">

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_valor_bruto">Bruto</label>
		<input id="input_valor_bruto" maxlength="18" name="input_valor_bruto" ng-disabled="true"
			   ng-model="object.valorBruto" type="text" ui-number-mask="2">
	</md-input-container>


	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_tributos">Tributos (-)</label>
		<input id="input_tributos" maxlength="18" name="input_tributos" ng-disabled="true" ng-model="object.valorTributoRecebido"
			   type="text" ui-number-mask="2">
	</md-input-container>


	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_valor_juros">Juros (+)</label>
		<input id="input_valor_juros" maxlength="18" name="input_valor_juros" ng-model="object.valorJuros" type="text"
			   ui-number-mask="2">
	</md-input-container>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_valor_liquido">Líquido (=)</label>
		<input id="input_valor_liquido" maxlength="18" name="input_valor_liquido" ng-disabled="true"
			   ng-model="valorLiquido"
			   style="font-weight: bold; width: 90%; {{valorLiquido < 0 ? 'color: red !important' : ''}}"
			   type="text" ui-number-mask="2" ui-negative-number>
	</md-input-container>
</div>

<div layout layout-sm="column" layout-wrap>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_emissao">Emissão</label>
		<input id="input_emissao" ng-disabled="true" ng-model="object.dataEmissao" tt-date-picker type="text">
	</md-input-container>


	<md-input-container flex flex-gt-md="25">
		<label id="lbl_vencimento">Vencimento</label>
		<input id="input_vencimento" min-date="object.dataEmissao" ng-disabled="true"
			   ng-model="object.dataVencimento" tt-date-picker type="text">
	</md-input-container>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_agendamento">Agendamento</label>
		<input id="input_agendamento" ng-disabled="true" ng-model="object.dataAgendamento" tt-date-picker type="text">
	</md-input-container>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_pagamento">Pagamento</label>
		<input id="input_pagamento" min-date="object.dataEmissao" name="input_pagamento"
			   ng-model="object.dataPagamento" ng-required="true" tt-date-picker type="text">
		<div ng-messages="form_etapa.input_pagamento.$error" role="alert">
			<div id="msg_req_pagamento" ng-message="required">Pagamento é um campo de preenchimento obrigatório.</div>
		</div>
	</md-input-container>

</div>

<div layout layout-sm="column" layout-wrap>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_contabilizacao">Contabilização</label>
		<input id="input_contabilizacao" name="input_contabilizacao" ng-model="object.dataContabilizacao"
			   ng-required="true" tt-date-picker type="text">
		<div ng-messages="form_etapa.dataContabilizacao.$error" role="alert">
			<div id="msg_req_contabilizacao" ng-message="required">Contabilização é um campo de preenchimento
				obrigatório.
			</div>
		</div>
	</md-input-container>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_banco">Banco</label>
		<md-select id="combo_banco" name="combo_banco" ng-change="$emit('changeBanco')"
				   ng-disabled="bancoList.length == 0" ng-model="object.bancoSelecionado"
				   ng-model-options="{trackBy: '$value.codigo'}" ng-required="true" required>
			<md-option ng-repeat="cc in bancoList | orderBy: 'banco.nome' | unique:'banco.nome'" ng-value="cc.banco">
				{{cc.banco.nome}}
			</md-option>
		</md-select>
		<div ng-messages="form_parcela.combo_banco.$error" role="alert">
			<div id="msg_req_banco" ng-message="required">Obrigatório.</div>
		</div>
	</md-input-container>

	<md-input-container flex="25">
		<label id="lbl_agencia_conta">Agência / Conta</label>
		<md-select id="combo_agencia_conta" name="agencia_conta" ng-change="$emit('changeAgenciaRecebimento')"
			ng-disabled="agenciaContaList == null || agenciaContaList.length == 0"
			ng-model="object.contaCorrente"
			ng-model-options="{trackBy: '$value.codigo'}" ng-required="true">
			<md-option ng-repeat="agenciaConta in agenciaContaList | orderBy: 'agencia' | orderBy: 'conta'"
				ng-value="agenciaConta" value="{{ agenciaConta }}">
				{{ montarLabelAgenciaConta(agenciaConta) }}
			</md-option>
		</md-select>
		<div ng-messages="wizardStep1.agencia_conta.$error" role="alert">
			<div id="msg_req_agencia" ng-message="required">Obrigatório.</div>
		</div>
	</md-input-container>

	<md-input-container flex="25">
		<label id="lbl_doc_pagamento">Tipo de documento para o pagamento do cliente</label>
		<md-select id="combo_doc_pagamento" name="doc_pagamento" ng-disabled="object.contaCorrente === null"
				   ng-model="object.tipoDocumentoRecebimento" ng-required="true">
			<md-option ng-repeat="docPagamento in enumTipoDocumentoPagamento" ng-value="docPagamento"
					   value="{{ docPagamento }}">
				{{ docPagamento }}
			</md-option>
		</md-select>
		<md-tooltip id="tool_tip_btn_editar" md-direction="bottom">
			<span class="h4">Tipo de documento para o pagamento do cliente</span>
		</md-tooltip>
		<div ng-messages="wizardStep1.doc_pagamento.$error" role="alert">
			<div id="msg_req_documento" ng-message="required">Obrigatório.</div>
		</div>
	</md-input-container>

</div>
