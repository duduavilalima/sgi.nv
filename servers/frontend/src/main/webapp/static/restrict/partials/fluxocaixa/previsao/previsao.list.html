<div class="page-layout simple fullwidth">
	<!-- HEADER -->
	<div class="header md-accent-bg">
		<div layout="column" layout-align="center start">
			<div class="breadcrumb white-text" layout="row" layout-align="start center">
				<md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="modulo">{{::modulo}}</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo">{{::titulo}}</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="subtitulo">{{::subtitulo}}</span>
			</div>
		</div>
		<span class="h2"></span>
	</div>
	<!-- / HEADER -->
	<!-- CONTENT -->
	<div class="content" md-background-bg>
		<div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
			<div class="content" flex>
				<!-- CAMPOS DE PESQUISA -->
				<div layout="row" layout-wrap>
					<div class="about" flex="100" layout="column">
						<div class="profile-box info-box general md-whiteframe-2dp" layout="column">
							<header class="md-accent-bg">
								<div class="title" id="titulo_filtro">{{ ::titulo}} - Filtros de pesquisa</div>
							</header>
							<div class="content">
								<form name="form" ui-keypress="{13:'buscar(1)'}">

									<div layout="row" layout-sm="column" layout-wrap layout-xs="column">
										<md-input-container flex flex-gt-md="50">
											<label id="lbl_empresa">Empresa</label>
											<md-select id="combo_empresa" name="empresa" ng-model="object.unidade">
												<md-option ng-repeat="item in listEmpresas" ng-value="item"
														   value="{{ item }}">{{ item.codnome }}
												</md-option>
											</md-select>
										</md-input-container>

										<md-input-container flex flex-gt-md="50">
											<label id="lbl_diretoria">Diretoria</label>
											<md-select id="combo_diretoria" name="diretoria"
													   ng-model="object.diretoria">
												<md-option
													ng-repeat="diretoria in listDiretorias | orderBy: 'descricao'"
													ng-value="diretoria" value="{{diretoria}}">{{ diretoria.descricao }}
												</md-option>
											</md-select>
										</md-input-container>
									</div>

									<div layout="row" layout-sm="column" layout-wrap layout-xs="column">
										<md-input-container flex flex-gt-md="50">
											<label id="lbl_despesa">Despesa</label>
											<input id="input_despesa" name="despesa" ng-model="object.despesaFC"
												   type="text">
										</md-input-container>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_data">Data</label>
											<input id="input_data" ng-model="object.data" tt-date-picker type="text">
										</md-input-container>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_valor">Valor</label>
											<input id="input_valor" maxlength="18" name="valorBruto"
												   ng-model="object.valorBruto" type="text" ui-number-mask="2">
										</md-input-container>
									</div>


									<section layout="row" layout-sm="row" layout-wrap>
										<div flex="30" flex-sm="10" layout="row" layout-align="start center">
											<md-button class="md-raised md-accent" id="btn_pesquisar"
													   name="btn_pesquisar" ng-click="buscar(1)" ng-disabled="isAction">
												Pesquisar
											</md-button>
											<md-button class="md-raised md-default" id="btn_limpar" name="btn_limpar"
													   ng-click="reset()" ng-disabled="isAction">
												Limpar
											</md-button>
										</div>
										<div flex="auto" layout-wrap show-gt-sm>
										</div>
										<div flex="30" flex-sm="10" layout="row" layout-align="end center">
											<md-button class="md-raised md-default" id="btn_novo" ng-disabled="isAction"
													   ui-sref="previsao.new">
												Nova previsão
											</md-button>
										</div>
									</section>
								</form>
							</div>
						</div>
					</div>
				</div>
				<!-- / CAMPOS DE PESQUISA -->
				<!-- DATATABLE - RESULTADO DA PESQUISA -->
				<div class="simple-table-container profile-box md-whiteframe-2dp" id="div_result"
					 ng-if="result && result != null">
					<header class="md-accent-bg">
						<div class="title" id="titulo_resultado">{{ ::titulo}} - Resultado da pesquisa</div>
					</header>
					<div class="sgiUiGridPesquisa" id="idGridFaturamentos" ng-if="exibirGrid(gridPesquisa)"
						 ng-style="ajustarAlturaTabela(gridPesquisa)" ui-grid="gridPesquisa" ui-grid-auto-resize
						 ui-grid-pinning></div>
					<div id="idMensagemPesquisa" ng-if="!exibirGrid(gridPesquisa)">
						<md-whiteframe class="md-whiteframe-1dp" flex="100" layout layout-align="center center">
							<span class="h4 p-32">{{mensagemPesquisa()}}</span>
						</md-whiteframe>
					</div>
					<section class="p-8" layout="row" layout-align="center center" layout-sm="row" layout-wrap>
						<div></div>
						<div ng-if="exibirGrid(gridPesquisa)" ng-include="'js/util/templates/paginacao.html'"></div>
					</section>

					<div class="p-8" flex="30" flex-sm="10" layout="row" layout-align="start start">
						<md-button class="md-raised md-default" id="btn_novo" ng-disabled="isAction"
								   ui-sref="previsao.new">
							Nova previsão
						</md-button>
					</div>
				</div>
				<!-- / DATATABLE - RESULTADO DA PESQUISA -->
			</div>
		</div>
	</div>
	<!-- / CONTENT -->
</div>
