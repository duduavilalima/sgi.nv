<md-dialog aria-label="Relação bancária - cheque: Confirmação" id="dialog_popup_confirmacao_conciliar">
	<form name="DialogForm">
		<md-toolbar class="md-accent-bg">
			<div class="md-toolbar-tools">
				<h2 id="titulo_popup_faturamento_confirmacao_cancelar" md-autofocus>{{ title }}</h2>
				<span flex></span>
				<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
					<md-icon aria-label="Close dialog" md-font-icon="icon-close"
							 style="color: rgba(255,255,255,0.87) !important"></md-icon>
				</md-button>
			</div>
		</md-toolbar>

		<md-dialog-content id="dialog_54" role="document" tabindex="-1">
			<div class="md-dialog-content md-dialog-content-body ng-scope">
				<p class="ng-binding" id="msg_popup_confirmacao_remover">
					{{ msg }}
				</p>
			</div>
			<md-divider></md-divider>
		</md-dialog-content>

		<md-dialog-actions class="navigation padding-8" layout="row">
			<md-button class="md-raised md-default" id="btn_confirmarTodos" ng-click="confirmTodos()"
					   ng-disabled="action">
				{{object.pagamentoIndividual ? 'Todos' : 'Imprimir'}}
				<md-tooltip class="h4">{{tooltip}}</md-tooltip>
			</md-button>
			<md-button class="md-raised md-default" id="btn_confirmarCheque" ng-click="confirmCheque()"
					   ng-disabled="action" ng-show="object.pagamentoIndividual && object.impressaoCheque">
				Selecionar
			</md-button>
			<md-button class="md-raised md-default" id="btn_cancelar" ng-click="cancel()" ng-disabled="action">
				CANCELAR
			</md-button>
			<span flex></span>
		</md-dialog-actions>
	</form>
</md-dialog>
