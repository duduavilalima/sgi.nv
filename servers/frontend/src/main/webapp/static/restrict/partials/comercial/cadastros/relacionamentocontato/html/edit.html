<div class="page-layout simple fullwidth" ng-controller="RelacionamentoContatoDetailCtrl as $ctrl">

	<!-- HEADER -->
	<div class="header md-accent-bg">
		<div layout="column" layout-align="center start">
			<div class="breadcrumb white-text" layout="row" layout-align="start center">
				<md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="modulo">Comercial</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo">Relacionamentos de Contato</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo_subtitulo">Edição</span>
			</div>
		</div>
		<span class="h2"></span>
	</div>
	<!-- / HEADER -->

	<div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
		<!-- CONTENT -->
		<div class="content" flex>
			<div layout="row" layout-wrap>
				<div class="about" flex="100" layout="column">
					<div class="profile-box info-box general md-whiteframe-1dp" layout="column">
						<header class="md-accent-bg">
							<div class="title" id="title_panel">Relacionamentos de Contato - Dados gerais</div>
						</header>

						<form name="DialogForm">
							<div class="p-16">
								<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

									<md-input-container flex="50" flex-sm="100" flex-xs="100">
										<label id="lbl_nome">Nome</label>
										<input id="input_nome" maxlength="50" name="input_nome" ng-model="$ctrl.object.nome"
											   required="true" type="text">
									</md-input-container>

									<md-input-container flex="50" flex-sm="100" flex-xs="100">
										<label id="lbl_perfil">Perfil</label>
										<md-select id="combo_perfil" name="perfil" ng-model="$ctrl.object.perfil"
												   ng-model-options="{trackBy: '$value.codigo'}" required="true">
											<md-option ng-repeat="item in $ctrl.listPerfis" ng-value="item"
													   value="{{ item.codigo }}">{{ item.descricao }}
											</md-option>
										</md-select>
									</md-input-container>
								</div>
							</div>

							<md-divider></md-divider>

							<div class="p-16">
								<div layout layout-sm="column" style="margin-top: -5px">
									<span>*</span>&nbsp;Campos obrigatórios
								</div>
							</div>

							<div class="navigation padding-8" flex layout="row" layout-align="start start">
								<md-button class="md-raised md-accent estilo_botoes" id="btn_salvar_nregistro"
										   ng-click="$ctrl.salvar()">
									Salvar
									<md-tooltip id="tool_tip_btn_salvar" md-direction="bottom">
										<span
											class="h4">Salvar as alterações realizadas neste relacionamento de contato</span>
									</md-tooltip>
								</md-button>
								<md-button class="md-raised md-primary estilo_botoes" id="btn_cancelar_nregistro"
										   ng-click="$ctrl.cancelarEdit()">
									Cancelar
									<md-tooltip id="tool_tip_btn_cancelar" md-direction="bottom">
										<span class="h4">Sair deste relacionamento de contato, sem gravar as modificações realizadas</span>
									</md-tooltip>
								</md-button>
							</div>
                        </form>
                        
					</div>
				</div>
			</div>
			<!-- / CONTENT -->
		</div>
	</div>
</div>
