<div class="page-layout simple fullwidth" ng-controller="categoriacontratoDetailCtrl as $ctrl">

	<!-- HEADER -->
	<div class="header md-accent-bg">
		<div layout="column" layout-align="center start">
			<div class="breadcrumb white-text" layout="row" layout-align="start center">
				<md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="modulo">Comercial</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo">Categoria do contrato</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo_subtitulo">Exibição</span>
			</div>
		</div>
		<span class="h2"></span>
	</div>
	<!-- / HEADER -->

	<div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
		<!-- CONTENT -->
		<div class="content" flex>
			<div layout="row" layout-wrap>
				<div class="about" flex="100" layout="column">
					<div class="profile-box info-box general md-whiteframe-1dp" layout="column">
						<header class="md-accent-bg">
							<div class="title" id="title_panel">Categoria do contrato - Dados Gerais</div>
						</header>
						<div>
							<div class="white-500-bg">
								<form name="CategoriaContratoForm" novalidate>
									<div flex layout="column">

										<div class="p-16" flex layout="column">
											<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

												<md-input-container flex flex-gt-md="75">
													<label id="lbl_descricao_exibir">Descrição</label>
													<input id="input_descricao_exibir" name="input_descricao_exibir"
														   ng-disabled="true" type="text" value="{{$ctrl.object.descricao}}">
												</md-input-container>

												<md-input-container flex flex-gt-md="25">
													<label id="lbl_tipo_exibir">Tipo</label>
													<input id="input_tipo_exibir" name="input_tipo_exibir"
														   ng-disabled="true" type="text" value="{{$ctrl.object.tipo}}">
												</md-input-container>

											</div>

										</div>

										<md-tabs md-border-bottom md-dynamic-height>

											<md-tab label="Controles">
												<md-content class="md-padding">
													<div flex layout="row" layout-sm="row" layout-xs="column">
														<md-input-container flex="70" flex-xs="100">
															<label>Cadastramento</label>
															<input id="cadastramento" name="cadastramento"
																   ng-disabled="true" type="text"
																   value="{{$ctrl.object.criador}}">
														</md-input-container>

														<md-input-container flex="30" flex-xs="100">
															<label>Data/hora</label>
															<input id="data_hora" name="data_hora" ng-disabled="true"
																   type="text"
																   value="{{$ctrl.object.dataCriacao | date:'dd/MM/yyyy HH:mm'}}">
														</md-input-container>
													</div>

													<div flex layout="row" layout-sm="row" layout-xs="column">
														<md-input-container flex="70" flex-xs="100">
															<label>Última alteração</label>
															<input id="alteracao" name="alteracao" ng-disabled="true"
																   type="text" value="{{$ctrl.object.atualizador}}">
														</md-input-container>

														<md-input-container flex="30" flex-xs="100">
															<label>Data/hora</label>
															<input id="data_hora2" name="data_hora2" ng-disabled="true"
																   type="text"
																   value="{{$ctrl.object.dataAtualizacao | date:'dd/MM/yyyy HH:mm'}}">
														</md-input-container>
													</div>

												</md-content>
											</md-tab>
										</md-tabs>

									</div>

									<md-divider></md-divider>

									<div class="p-8" flex layout="row" layout-xs="column">
										<div flex layout="row" layout-align="start start">
											<md-button aria-label="Editar" class="md-raised md-accent" id="btn_editar" ng-click="$ctrl.editar()">
												Editar
												<md-tooltip id="tool_tip_btn_editar" md-direction="bottom">
													<span class="h4">Editar esta categoria de contrato</span>
												</md-tooltip>
											</md-button>

											<md-button aria-label="Retornar" class="md-raised md-accent" id="btn_retornar" ng-click="$ctrl.retornar()">
												Retornar
												<md-tooltip id="tool_tip_btn_retornar" md-direction="bottom">
													<span
														class="h4">Sair desta tela e retornar para a tela anterior</span>
												</md-tooltip>
											</md-button>
										</div>

										<div flex layout="row" layout-align="end center">
											<md-button aria-label="Remover" class="md-raised md-accent" id="btn_remover" ng-click="$ctrl.removerCategoriaContrato($event)">
												Remover
												<md-tooltip id="tool_tip_btn_remover" md-direction="bottom">
													<span class="h4">Remover esta a categoria de contrato (esta operação não poderá ser desfeita)</span>
												</md-tooltip>
											</md-button>
										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- / CONTENT -->
	</div>
</div>
