<div class="page-layout simple fullwidth" ng-controller="categoriacontratoDetailCtrl as $ctrl">

	<!-- HEADER -->
	<div class="header md-accent-bg">
		<div layout="column" layout-align="center start">
			<div class="breadcrumb white-text" layout="row" layout-align="start center">
				<md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="modulo">Comercial</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo">Categoria do contrato</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo_subtitulo">Novo</span>
			</div>
		</div>
		<span class="h2"></span>
	</div>
	<!-- / HEADER -->

	<div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
		<!-- CONTENT -->
		<div class="content" flex>
			<div layout="row" layout-wrap>
				<div class="about" flex="100" layout="column">
					<div class="profile-box info-box general md-whiteframe-1dp" layout="column">
						<header class="md-accent-bg">
							<div class="title" id="title_panel">Categoria do contrato - Dados Gerais</div>
						</header>
						<div>
							<div class="white-500-bg">
								<form name="CategoriaContratoForm" novalidate>
									<div flex layout="column">
										<div class="p-16" flex layout="column">
											<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

												<md-input-container flex flex-gt-md="75">
													<label id="lbl_descricao">Descrição</label>
													<input id="input_descricao" name="input_descricao" ng-model="$ctrl.object.descricao" required="true" type="text">
												</md-input-container>

												<md-input-container flex flex-gt-md="25">
													<label id="lbl_tipo">Tipo</label>
													<md-select id="combo_tipo" name="tipo" ng-model="$ctrl.object.tipo" required="true">
														<md-option ng-repeat="item in $ctrl.listtipo" ng-value="item" value="{{ item }}">
															{{ item }}
														</md-option>
													</md-select>
												</md-input-container>

											</div>
										</div>

										<div class="pb-16 pr-16 pl-16" flex layout="row" layout-align="start start">
											<span class="red-fg">*&nbsp;</span> Campos obrigatórios
										</div>

									</div>

									<md-divider></md-divider>

									<div class="p-8" flex layout="row" layout-align="start start" layout-xs="column">
										<md-button class="md-raised md-accent" id="btn_salvar" ng-click="$ctrl.salvar()" ng-disabled="CategoriaContratoForm.$invalid">
											Salvar
											<md-tooltip id="tool_tip_btn_salvar" md-direction="bottom">
												<span class="h4">Salvar as alterações realizadas nesta categoria de contrato</span>
											</md-tooltip>
										</md-button>

										<md-button class="md-raised md-accent" id="btn_cancelar"
												   ng-click="$ctrl.cancelarEdit()">
											Cancelar
											<md-tooltip id="tool_tip_btn_cancelar" md-direction="bottom">
												<span class="h4">Sair desta categoria de contrato, sem gravar as modificações realizadas</span>
											</md-tooltip>
										</md-button>
									</div>

								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- / CONTENT -->
	</div>
</div>
