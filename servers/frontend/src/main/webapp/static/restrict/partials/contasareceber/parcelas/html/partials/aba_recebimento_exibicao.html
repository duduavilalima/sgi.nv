<div layout layout-sm="column" layout-wrap style="margin-top: 0px;">

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_valor_bruto">Bruto</label>
		<input id="input_valor_bruto" maxlength="18" name="input_valor_bruto" ng-disabled="true"
			   ng-model="object.valorBruto" type="text" ui-number-mask="2">
	</md-input-container>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_tributos">Tributos (-)</label>
		<input id="input_tributos" maxlength="18" name="input_tributos" ng-disabled="true" ng-model="valorTributos"
			   type="text" ui-number-mask="2">
	</md-input-container>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_subtotal">Subtotal</label>
		<input id="input_subtotal" maxlength="18" name="input_subtotal" ng-disabled="true" ng-model="subtotal"
			   type="text" ui-number-mask="2">
		<md-tooltip id="tool_tip_input_subtotal" md-direction="bottom">
			<span class="h4">Valor bruto menos tributos, exceto PIS/COFINS/CSLL</span>
		</md-tooltip>
	</md-input-container>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_retencao_contratual_val">Retenção contratual (-)</label>
		<input id="input_retencao_contratual_val" maxlength="18" name="input_retencao_contratual_val" ng-disabled="true"
			   ng-model="object.valorRetencaoRetida" type="text" ui-number-mask="2">
	</md-input-container>

</div>

<div layout layout-sm="column" layout-wrap>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_valor_desconto">Desconto (-)</label>
		<input id="input_valor_desconto" maxlength="18" name="input_valor_desconto" ng-disabled="true"
			   ng-model="object.valorDesconto" type="text" ui-number-mask="2">
	</md-input-container>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_devolucao">Devolução (+)</label>
		<input id="input_devolucao" maxlength="18" name="input_devolucao" ng-disabled="true"
			   ng-model="object.valorDevolucao" type="text" ui-number-mask="2">
	</md-input-container>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_valor_juros">Juros (+)</label>
		<input id="input_valor_juros" maxlength="18" name="input_valor_juros" ng-disabled="true"
			   ng-model="object.valorJuros" type="text" ui-number-mask="2">
	</md-input-container>

	<md-input-container flex="25" flex-sm="100">
		<label id="lbl_valor_liquido_errado">Líquido (=)</label>
		<input id="input_valor_liquido_errado" maxlength="18" name="input_valor_liquido" ng-disabled="true"
			   ng-model="object.valorLiquido"
			   style="font-weight: bold; {{isValorLiquidoDiferente() ? 'color: red !important' : ''}};
			   {{object.valorLiquido < 0 ? 'color: red !important' : ''}}" type="text"
			   ui-number-mask="2" ui-negative-number>
	</md-input-container>

</div>


<div layout layout-sm="column" layout-wrap>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_emissao">Emissão</label>
		<input id="input_emissao" ng-disabled="true" ng-model="object.notaSaida.dataEmissao" tt-date-picker type="text">
	</md-input-container>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_vencimento">Vencimento</label>
		<input id="input_vencimento" min-date="object.notaSaida.dataEmissao" ng-disabled="true"
			   ng-model="object.dataVencimento" tt-date-picker type="text">
	</md-input-container>

	<md-input-container flex="50">
		<label id="lbl_motivo_alteracao_vencimento">Motivo de alteração da data de vencimento</label>
		<input id="input_motivo_alteracao_vencimento" maxlength="200" name="descricao_item" ng-disabled="true"
			   ng-maxlength="200" ng-model="object.motivoDataVencimento" type="text">
	</md-input-container>

</div>

<div layout layout-sm="column" layout-wrap>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_agendamento" >Agendamento</label>
		<input id="input_agendamento" ng-disabled="true" ng-model="object.dataAgendamento" tt-date-picker type="text">
	</md-input-container>

	<md-input-container flex="50">
		<label id="lbl_motivo_agendamento">Observações</label>
		<input class="link-contrato" id="input_motivo_agendamento" maxlength="2000" name="input_motivo_agendamento" ng-disabled="false"
			   ng-maxlength="2000" ng-model="object.motivoDataAgendamento | limitTo:92" type="text" ng-click="reagendarLeitura($event)">
	</md-input-container>

	<md-input-container flex flex-gt-md="25">
		<label id="lbl_pagamento">Pagamento</label>
		<input id="input_pagamento" min-date="object.notaSaida.dataEmissao" ng-disabled="true"
			   ng-model="object.dataPagamento" tt-date-picker type="text">
	</md-input-container>

</div>

<div layout layout-sm="column" layout-wrap>

	<md-input-container flex="25">
		<label id="lbl_contabilizacao">Contabilização</label>
		<input id="input_contabilizacao" ng-disabled="true" ng-model="object.dataContabilizacao" tt-date-picker
			   type="text">
	</md-input-container>

	<md-input-container flex="25">
		<label id="lbl_combo_banco_exibicao">Banco</label>
		<input id="input_combo_banco_exibicao" name="banco_exibicao" ng-disabled="true"
			   ng-model="object.contaCorrente.banco.nome" type="text">
	</md-input-container>

	<md-input-container flex="25">
		<label id="lbl_agencia_conta_exibicao">Agência / Conta</label>
		<input id="input_agencia_conta_exibicao" name="agencia_conta_exibicao" ng-disabled="true" type="text"
			   value="{{ object.contaCorrente.agencia }} / {{ object.contaCorrente.conta }}">
	</md-input-container>

	<md-input-container flex="25">
		<label id="lbl_combo_doc_pagamento_exibicao">Tipo de documento para o pagamento do cliente</label>
		<input id="input_combo_doc_pagamento_exibicao" name="doc_pagamento_exibicao" ng-disabled="true"
			   ng-model="object.tipoDocumento" type="text">
		<md-tooltip id="tool_tip_btn_editar" md-direction="bottom">
			<span class="h4">Tipo de documento para o pagamento do cliente</span>
		</md-tooltip>
	</md-input-container>

</div>

<div class="navigation padding-8" flex layout="row" style="margin-top: -0px;margin-left: -15px;">
	<md-button class="md-raised md-accent" id="btn_editar_dados_principais" ng-click="editarParcela()"
			   ng-if="temPerfilAnalista && !temPerfilFaturamentoCnsGerencia" ng-show="object.situacao == 'Em recebimento'">
		Editar
		<md-tooltip id="tool_tip_btn_editar" md-direction="bottom">
			<span class="h4">Editar dados desta parcela</span>
		</md-tooltip>
	</md-button>
</div>
