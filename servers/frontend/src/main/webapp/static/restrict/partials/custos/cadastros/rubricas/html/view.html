<div class="page-layout simple fullwidth" ng-controller="RubricasCtrl as $ctrl">

    <!-- HEADER -->
    <div class="header md-accent-bg">
        <div layout="column" layout-align="center start">
            <div class="breadcrumb white-text" layout="row" layout-align="start center">
                <md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="modulo">Custos</span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="modulo">Cadastros</span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="titulo">Rubricas</span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent"
					  id="titulo_subtitulo">Edibição</span>
            </div>
            <!--<div class="title">Datatable</div>-->
        </div>
        <span class="h2"></span>
    </div>
    <!-- / HEADER -->

    <div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
        <!-- CONTENT -->
        <div class="content" flex>
            <div layout="row" layout-wrap>
                <div class="about" flex="100" layout="column">
                    <div class="profile-box info-box general md-whiteframe-1dp" layout="column">
                        <header class="md-accent-bg">
                            <div class="title" id="title_panel">Rubricas - Dados Gerais</div>
                        </header>

                        <div class="text-center"><img ng-if="!$ctrl.object"
													  src="../img/carregando.gif"
													  style="height: 30px;width: 30px;margin-top: 10px;margin-bottom: 10px"/></div>

                            <div ng-if="$ctrl.object">
                                <div class="white-500-bg">
                                    <form name="form" novalidate>
                                        <div flex layout="column">
                                            <div class="p-16" flex layout="column">
                                                <div layout="row" layout-sm="column" layout-wrap layout-xs="column">

                                                    <md-input-container flex flex-gt-md="50">
                                                        <label id="lbl_descricao">Descrição</label>
                                                        <input id="input_descricao" name="input_descricao" value="{{::$ctrl.object.descricao}}" ng-disabled="true" type="text">
                                                    </md-input-container>

                                                    <md-input-container flex flex-gt-md="50">
                                                        <label id="lbl_rubrica_pai">Rubrica pai</label>
                                                        <input id="input_rubrica_pai" name="input_rubrica_pai" value="{{::$ctrl.object.pai.descricao}}" ng-disabled="true" type="text">
                                                    </md-input-container>

                                                    <md-input-container flex flex-gt-md="25">
                                                        <label id="lbl_ordem">Ordem</label>
                                                        <input id="input_ordem" name="input_ordem" value="{{::$ctrl.object.ordem}}" ng-disabled="true" type="text">
                                                    </md-input-container>

                                                    <md-input-container flex flex-gt-md="25">
                                                        <label id="lbl_situacao">Situação</label>
                                                        <input id="input_situacao" name="input_situacao" value="{{$ctrl.object.situacao === 'ATIVA' ? 'Ativa' : 'Inativa'}}" ng-disabled="true" type="text">
                                                    </md-input-container>

                                                    <md-input-container flex flex-gt-md="25">
                                                        <label id="lbl_tipo">Tipo</label>
                                                        <input id="input_tipo" name="input_tipo"
                                                            value="{{$ctrl.object.tipo === 'RECEBIMENTO' ? 'Recebimento' : $ctrl.object.tipo === 'CUSTO' ? 'Custo' : $ctrl.object.tipo === 'DESPESA_CENTRO_CUSTOS' ? 'Despesa de centro de custos (não disponível para CL, somente gerências, diretorias e empresas)' : $ctrl.object.tipo === 'RESULTADO' ? 'Resultado (soma dos recebimentos e custos)' : 'Não definido'}}"
                                                            ng-disabled="true" type="text">
                                                    </md-input-container>

                                                    <md-input-container flex flex-gt-md="25">
                                                        <label id="lbl_operacao">Operação</label>
                                                        <input id="input_operacao" name="input_operacao" value="{{$ctrl.object.operacao === 'SOMA' ? 'Soma' : 'Subtração'}}" ng-disabled="true" type="text">
                                                    </md-input-container>

                                                </div>


                                            </div>
                                            <md-tabs md-border-bottom md-dynamic-height>

                                                <md-tab label="Controles">
                                                    <md-content class="md-padding">
                                                        <div flex layout="row" layout-sm="row" layout-xs="column">
                                                            <md-input-container flex="70" flex-xs="100">
                                                                <label>Cadastramento</label>
                                                                <input id="cadastramento" name="cadastramento" ng-disabled="true" type="text" value="{{ ::$ctrl.object.criador }}"></input>
                                                            </md-input-container>

                                                            <md-input-container flex="30" flex-xs="100">
                                                                <label>Data/hora</label>
                                                                <input id="data_hora" name="data_hora" ng-disabled="true" type="text" value="{{ ::$ctrl.object.dataCriacao | date: 'dd/MM/yyyy HH:mm:ss' }}"></input>
                                                            </md-input-container>
                                                        </div>

                                                        <div flex layout="row" layout-sm="row" layout-xs="column">
                                                            <md-input-container flex="70" flex-xs="100">
                                                                <label>Última alteração</label>
                                                                <input id="alteracao" name="alteracao" ng-disabled="true" type="text" value="{{ ::$ctrl.object.atualizador }}"></input>
                                                            </md-input-container>

                                                            <md-input-container flex="30" flex-xs="100">
                                                                <label>Data/hora</label>
                                                                <input id="data_hora2" name="data_hora2" ng-disabled="true" type="text" value="{{ ::$ctrl.object.dataAtualizacao | date: 'dd/MM/yyyy HH:mm:ss'}}"></input>
                                                            </md-input-container>
                                                        </div>
                                                    </md-content>
                                                </md-tab>
                                            </md-tabs>

                                        </div>


                                        <md-divider></md-divider>

                                        <div class="p-8" flex layout="row" layout-align="start start">
                                            <md-button class="md-raised md-accent" id="btn_salvar" ng-click="$ctrl.editar()" ng-disabled="form.$invalid || $ctrl.action">
                                                Editar
                                                <img ng-if="$ctrl.action"
												 src="../img/gray_carregando.gif" style="height: 20px;width: 20px;margin-top: 8px;"/>
                                                <md-tooltip class="h4">Salvar as alterações realizadas nesta rubrica
                                                </md-tooltip>
                                            </md-button>

                                            <md-button class="md-raised md-accent" id="btn_cancelar" ng-click="$ctrl.retornar()" ng-disabled="!$ctrl.object || $ctrl.action">
                                                Retornar
                                                <md-tooltip class="h4">Sair desta rubrica, sem gravar as modificações
                                                    realizadas
                                                </md-tooltip>
                                            </md-button>
                                        </div>

                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- / CONTENT -->
        </div>
    </div>
