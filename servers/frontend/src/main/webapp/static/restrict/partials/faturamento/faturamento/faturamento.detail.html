<div class="page-layout simple fullwidth" ng-controller="FaturamentoCadastroCtrl"
	 ng-show="object && object != null">

	<!-- HEADER -->
	<div class="header md-accent-bg">
		<div layout="column" layout-align="center start">
			<div class="breadcrumb white-text" layout="row" layout-align="start center">
				<md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="modulo">{{::modulo}}</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo">{{ ::titulo}}</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo_subtitulo">{{ subtitulo}}</span>
			</div>
		</div>
		<span class="h2"></span>
	</div>
	<!-- / HEADER -->

	<div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
		<!-- CONTENT -->
		<div class="content" flex>
			<div layout="row" layout-wrap>
				<div class="about" flex="100" layout="column">
					<div class="profile-box info-box general md-whiteframe-1dp" layout="column">
						<header class="md-accent-bg">
							<div class="title" id="title_panel">{{ ::modulo }} - {{subtitulo}}</div>
						</header>

						<div class="text-center"><img ng-show="object.codigo === null" src="../img/carregando.gif"
													  style="height: 30px;width: 30px;margin-top: 10px;margin-bottom: 10px"/>
						</div>

						<div ng-show="object && object != null && object.codigo != null">
							<div class="white-500-bg">
								<md-content>
									<md-tabs id="abas_faturamento" md-border-bottom md-dynamic-height
											 md-selected="index" name="abas_faturamento"
											 ng-show="object && object != null && object.codigo != null">
										<md-tab id="aba_dados_principais" label="Dados Principais"
												name="aba_dados_principais"
												ng-disabled="modeContrato === true || modeInformacoes === true || modeTributos === true || modeDiscriminacao === true">
											<form name="wizardStep1">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_dados_principais.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_contrato" label="Contrato" name="aba_contrato"
												ng-disabled="modeDadosPrincipais === true || modeInformacoes === true || modeDiscriminacao === true || modeEdicaoPosAberta === true || modeTributos === true">
											<form name="wizardStep2">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_contrato.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_contato" label="Contato" name="aba_contato"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeTributos === true || modeDiscriminacao === true || modeEdicaoPosAberta === true">
											<form name="wizardStep3">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_contato.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_informacoes_complementares" label="Info. Complementares"
												name="aba_informacoes"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeDiscriminacao === true || modeEdicaoPosAberta === true || modeTributos === true">
											<form name="wizardStep4">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_informacoes_complementares.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_tributos" label="Tributos" name="aba_tributos" ng-if="object.tipoFornecimento !== 'Só material'"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeDiscriminacao === true || modeEdicaoPosAberta === true">
											<form name="wizardStep5">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_tributos.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_discriminacao_servicos" label="Discriminação"
												name="aba_servicos"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeTributos === true || modeEdicaoPosAberta === true">
											<form name="wizardStep6">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_discriminacao_servicos.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_discriminacao_etapas" label="Etapas"
												md-on-select="onEtapasTabSelected()"
												name="aba_etapas"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeTributos === true || modeDiscriminacao === true || modeEdicaoPosAberta === true">
											<form name="wizardStep7">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_etapas.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_notas_fiscais" label="Notas Fiscais"
												md-on-select="onNotasFiscaisTabSelected()"
												name="aba_notas"
												ng-if="object.tipoDocumentoFaturamento == 'Nota fiscal'"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeTributos === true || modeDiscriminacao === true || modeEdicaoPosAberta === true">
											<form name="wizardStep8">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_notas_fiscais.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_notas_debito" label="Notas de Débito"
												md-on-select="onNotasDebitoTabSelected()"
												name="aba_notas"
												ng-if="object.tipoDocumentoFaturamento == 'Nota de débito'"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeTributos === true || modeDiscriminacao === true || modeEdicaoPosAberta === true">
											<form name="wizardStep8">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_notas_debito.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_cancelamentos" label="Cancelamento" name="aba_cancelamentos"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeTributos === true || modeDiscriminacao === true || modeEdicaoPosAberta === true"
												ng-if="object.situacao === 'Cancelado' && (listMotivos != null && listMotivos.length > 0)">
											<form name="wizardStep9">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_cancelamento.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_controles" label="Controles" name="aba_controles"
												ng-disabled="modeDadosPrincipais === true || modeContrato === true || modeInformacoes === true || modeTributos === true || modeDiscriminacao === true || modeEdicaoPosAberta === true">
											<form name="wizardStep10">
												<div class="padding-16"
													 ng-include="'partials/faturamento/faturamento/partials/aba_controles.html'">
												</div>
											</form>
										</md-tab>
										<md-tab id="aba_discriminacao_servicos" label=" " name="aba_servicos"
												ng-disabled="true">
										</md-tab>
									</md-tabs>
									<md-divider></md-divider>
									<div class="navigation padding-8" flex layout="row">
										<div flex="100" flex-sm="100" layout="row" layout-align="start center"
											 ng-if="screenMode !== 'NEW'">
											<md-button class="md-raised md-accent" id="btn_retornar" ng-click="listar()"
													   ng-disabled="screenMode === 'EDIT' || action">
												Retornar
												<md-tooltip id="tool_tip_btn_retornar" md-direction="bottom">
													<span
														class="h4">Sair desta tela e retornar para a tela anterior</span>
												</md-tooltip>
											</md-button>
										</div>
										<div flex="100" flex-sm="100" layout="row" layout-align="end center"
											 ng-if="screenMode !== 'NEW' && habilitarBotoesFaturamento">
											<md-button class="md-raised md-accent" id="btn_cancelar"
													   layout-align="end center" ng-click="cancelarFaturamento($event)"
													   ng-disabled="screenMode === 'EDIT' || action"
													   ng-if="object.situacao !== 'Cancelado'">
												Cancelar
												<md-tooltip id="tool_tip_btn_cancelar" md-direction="bottom">
													<span class="h4">Cancelar este faturamento (esta operação não poderá ser desfeita)</span>
												</md-tooltip>
											</md-button>
											<md-button class="md-raised md-accent" id="btn_remover"
													   layout-align="end center" ng-click="removerFaturamento($event)"
													   ng-disabled="screenMode === 'EDIT' || action"
													   ng-if="object.situacao === 'Aberto'">
												Remover
												<md-tooltip id="tool_tip_btn_remover" md-direction="bottom">
													<span class="h4">Remover este faturamento (esta operação não poderá ser desfeita)</span>
												</md-tooltip>
											</md-button>
										</div>
									</div>
								</md-content>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- / CONTENT -->
	</div>
</div>
