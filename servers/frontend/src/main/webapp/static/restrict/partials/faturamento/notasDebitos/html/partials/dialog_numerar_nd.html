<md-dialog aria-label="Nota de Débito - Numerar: Confirmação" id="dialog_titulo_popup_nota_debito_cadastro_prefeitura"
		   style="width: 700px;">
	<form name="DialogNumerarForm">
		<md-toolbar class="md-accent-bg">
			<div class="md-toolbar-tools">
				<h2 id="titulo_popup_nota_debito_cadastro_prefeitura" md-autofocus>Nota de Débito - Numerar:
					Confirmação</h2>
				<span flex></span>
				<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
					<md-icon aria-label="Close dialog" md-font-icon="icon-close"
							 style="color: rgba(255,255,255,0.87) !important"></md-icon>
				</md-button>
			</div>
		</md-toolbar>
		<md-dialog-content class="white-bg" role="document">
			<div class="md-dialog-content" md-theme="sgi">

				<div layout layout-sm="column">
					<md-input-container flex>
						<label id="lbl_numero_dialog_numerar">Número da ND </label>
						<input id="input_numero_dialog_numerar" maxlength="12" md-maxlength="12"
							   name="input_numero_dialog_numerar" ng-maxlength="12" ng-model="object.numero"
							   ng-required="true" type="text" value="{{ object.numero }}">
						<div ng-messages="DialogNumerarForm.input_numero_dialog_numerar.$error" role="alert">
							<div ng-message="required">Obrigatório.</div>
							<div ng-message="maxlength">O nome informado é muito longo.</div>
						</div>
					</md-input-container>

					<md-input-container flex>
						<label id="lbl_emissao_dialog_numerar">Emissão</label>
						<input id="input_emissao_dialog_numerar" name="input_emissao_dialog_numerar"
							   ng-model="object.dataEmissao" ng-required="true" tt-date-picker type="text">
						<div ng-messages="DialogNumerarForm.input_emissao_dialog_numerar.$error" role="alert">
							<div ng-message="required">Obrigatório.</div>
						</div>
					</md-input-container>

				</div>
			</div>

			<md-divider></md-divider>
		</md-dialog-content>

		<md-dialog-actions class="white-bg" layout="row">
			<md-button class="md-raised md-default" id="btn_confirmar_dialog_numerar" ng-click="confirm()"
					   ng-disabled="DialogNumerarForm.$invalid || action">
				<span>CONFIRMAR </span>
				<img ng-show="action" src="../img/gray_carregando.gif"
					 style="height: 20px;width: 20px;margin-top: 8px;"/>
				<md-tooltip id="tool_tip_btn_confirmar_dialog_numerar" md-direction="bottom">
					<span class="h4">Confirmar numeração para esta nota de débito</span>
				</md-tooltip>
			</md-button>
			<md-button class="md-raised md-default" id="btn_cancelar_dialog_numerar" ng-click="cancel()"
					   ng-disabled="action">
				CANCELAR
				<md-tooltip id="tool_tip_btn_cancelar_dialog_numerar" md-direction="bottom">
					<span class="h4">Cancelar as alterações realizadas na numeração desta nota de débito</span>
				</md-tooltip>
			</md-button>
			<span flex></span>
		</md-dialog-actions>
	</form>
</md-dialog>
