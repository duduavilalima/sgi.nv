<md-content class="md-padding" layout="column">

	<div ng-if="!$ctrl.object.listaEnderecos || $ctrl.object.listaEnderecos.length <= 0">
		<md-whiteframe class="md-whiteframe-1dp" flex="100" layout layout-align="center center">
			<span class="h4 p-32">Não existe <b>endereço</b> associado a este centro financeiro.</span>
		</md-whiteframe>
	</div>

	<div ng-if="$ctrl.object.listaEnderecos && $ctrl.object.listaEnderecos.length > 0">
		<table border="1" class="tabela_exibicao hover md-caption" ms-responsive-table width="100%">
			<thead>
			<tr class="grey-200-bg">
				<th style="border: 1px solid #c4c4c4;" width="7%">
					<div class="table-header text-center"><span class="column-title">Principal</span></div>
				</th>
				<th style="border: 1px solid #c4c4c4;" width="15%">
					<div class="table-header text-center"><span class="column-title">Tipo</span></div>
				</th>
				<th style="border: 1px solid #c4c4c4;" width="43%">
					<div class="table-header text-center"><span class="column-title">Endereço</span></div>
				</th>
				<th style="border: 1px solid #c4c4c4;" width="25%">
					<div class="table-header text-center"><span class="column-title">Cidade/UF</span></div>
				</th>
				<th ng-if="screenMode !== 'VIEW'" style="border: 1px solid #c4c4c4;" width="10%">
					<div class="table-header text-center"><span class="column-title">Opções</span></div>
				</th>
			</tr>
			</thead>
			<tbody>
			<tr ng-repeat="cfEndereco in $ctrl.object.listaEnderecos" style="border-bottom: 1px solid #c4c4c4;">
				<td class="text-center celula" style="padding: 8px !important;">
					<div ng-if="cfEndereco.endereco.principal && screenMode === 'VIEW' ">
						<md-icon class="green-400-fg" md-font-icon="icon-check"></md-icon>
					</div>

					<md-checkbox aria-label="Selecionar" class="md-sgi-theme" ng-checked="$ctrl.exists(cfEndereco)"
								 ng-click="$ctrl.selecionar(cfEndereco)" ng-if="screenMode !== 'VIEW'"
								 style="margin-bottom: 0px; margin-left: 10px;">
					</md-checkbox>
				</td>
				<td class="text-left celula pl-5"> {{ cfEndereco.tipo }}</td>
				<td class="text-left celula pl-5"> {{ cfEndereco.endereco.enderecoCompleto }}</td>
				<td class="text-left celula pl-5"> {{ cfEndereco.endereco.cidade.cidadeUf }}</td>

				<td class="text-center celula pl-5" ng-if="screenMode !== 'VIEW'">
					<md-button class="md-icon-button" id="btn_editar_endereco_{{$index}}"
							   name="btn_editar_endereco_{{$index}}" ng-click="$ctrl.editarEndereco($event, cfEndereco)"
							   style="padding: 0px 0px 0px 0px; margin: -5px -5px -5px -5px;">
						<md-icon md-font-icon="icon-pencil"></md-icon>
						<md-tooltip class="h3" md-direction="bottom">
							Editar endereço
						</md-tooltip>
					</md-button>
					<md-button class="md-icon-button" id="btn_excluir_endereco_{{$index}}"
							   name="btn_excluir_endereco_{{$index}}" ng-click="$ctrl.excluirEndereco(cfEndereco)"
							   style="padding: 0px 0px 0px 0px; margin: -5px -5px -5px -5px;">
						<md-icon class="red-400-fg" md-font-icon="icon-close"></md-icon>
						<md-tooltip class="h3" md-direction="bottom">
							Excluir endereço
						</md-tooltip>
					</md-button>

				</td>
			</tr>
			</tbody>
		</table>
	</div>

	<div class="pt-8" flex layout="row" layout-align="start start" layout-xs="column" ng-if="screenMode !== 'VIEW'">
		<md-button class="md-raised md-accent" id="btn_novo_endereco" ng-click="$ctrl.chamarDialogNovoEndereco()">
			Novo endereço
		</md-button>
	</div>
</md-content>
