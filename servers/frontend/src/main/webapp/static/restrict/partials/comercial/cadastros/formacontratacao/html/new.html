<div class="page-layout simple fullwidth" ng-controller="formacontratacaoDetailCtrl as $ctrl">

    <!-- HEADER -->
    <div class="header md-accent-bg">
        <div layout="column" layout-align="center start">
            <div class="breadcrumb white-text" layout="row" layout-align="start center">
                <md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="modulo">Comercial</span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="titulo">Forma de contratação
                </span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="titulo_subtitulo">Novo</span>
            </div>
        </div>
        <span class="h2"></span>
    </div>
    <!-- / HEADER -->

    <div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
        <!-- CONTENT -->
        <div class="content" flex>
            <div layout="row" layout-wrap>
                <div class="about" flex="100" layout="column">
                    <div class="profile-box info-box general md-whiteframe-1dp" layout="column">
                        <header class="md-accent-bg">
                            <div class="title" id="title_panel">Forma de contratação - Dados gerais</div>
                        </header>

                        <md-progress-linear class="md-warn" md-mode="query" ng-show="$ctrl.object === undefined">
                        </md-progress-linear>

                        <div class="white-500-bg">
                            <form name="FormaContratacaoForm" novalidate>

                                <div flex layout="column">
                                    <div class="p-16" flex layout="row" layout-sm="column" layout-wrap
                                        layout-xs="column">

                                        <md-input-container flex flex-gt-md="25" flex-sm="100" flex-xs="100">
                                            <label id="lbl_nome">Nome</label>
                                            <input id="input_nome" name="nome" ng-model="$ctrl.object.nome" required
                                                type="text">
                                            <div ng-messages="FormaContratacaoForm.nome.$error"
                                                ng-show="FormaContratacaoForm.nome.$touched">
                                                <div ng-message="required">
                                                    Obrigatório.
                                                </div>
                                            </div>
                                        </md-input-container>

                                        <md-input-container flex flex-gt-md="50" flex-sm="100" flex-xs="100">
                                            <label id="lbl_descricao">Descrição</label>
                                            <input id="input_descricao" name="descricao"
                                                ng-model="$ctrl.object.descricao" required type="text">
                                            <div ng-messages="FormaContratacaoForm.descricao.$error"
                                                ng-show="FormaContratacaoForm.descricao.$touched">
                                                <div ng-message="required">
                                                    Obrigatório.
                                                </div>
                                            </div>
                                        </md-input-container>

                                        <md-input-container flex flex-gt-md="25" flex-sm="100" flex-xs="100">
                                            <label id="lbl_tipo">Tipo</label>
                                            <md-select id="combo_tipo" name="tipo" ng-model="$ctrl.object.tipo"
                                                required>
                                                <md-option ng-repeat="item in $ctrl.listTipos" ng-value="item"
                                                    value="{{ item }}">{{ item }}
                                                </md-option>
                                            </md-select>
                                            <div ng-messages="FormaContratacaoForm.tipo.$error"
                                                ng-show="FormaContratacaoForm.tipo.$touched">
                                                <div ng-message="required">
                                                    Obrigatório.
                                                </div>
                                            </div>
                                        </md-input-container>
                                    </div>

                                    <div class="pb-16 pr-16 pl-16" flex layout="row" layout-align="start start">
                                        <span class="red-fg">*&nbsp;</span> Campos obrigatórios
                                    </div>
                                </div>

                                <md-divider></md-divider>
                                <div class="p-8" flex layout="row" layout-align="start start" layout-xs="column">
                                    <md-button class="md-raised md-accent estilo_botoes" id="btn_salvar_nregistro"
                                        ng-click="$ctrl.salvar()" ng-disabled="$ctrl.FormaContratacaoForm.$invalid">
                                        Salvar
                                        <md-tooltip id="tool_tip_btn_salvar" md-direction="bottom">
                                            <span class="h4">Salvar as alterações realizadas nesta forma de
                                                contratação</span>
                                        </md-tooltip>
                                    </md-button>
                                    <md-button class="md-raised md-primary estilo_botoes" id="btn_cancelar_nregistro"
                                        ng-click="$ctrl.cancelar()">
                                        Cancelar
                                        <md-tooltip id="tool_tip_btn_cancelar" md-direction="bottom">
                                            <span class="h4">Sair desta forma de contratação, sem gravar as modificações
                                                realizadas</span>
                                        </md-tooltip>
                                    </md-button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- / CONTENT -->
    </div>
</div>
