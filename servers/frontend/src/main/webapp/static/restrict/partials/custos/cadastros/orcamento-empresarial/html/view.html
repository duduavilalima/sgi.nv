<div class="page-layout simple fullwidth" ng-controller="OrcamentoEmpresarialCtrl as $ctrl">

    <!-- HEADER -->
    <div class="header md-accent-bg">
        <div layout="column" layout-align="center start">
            <div class="breadcrumb white-text" layout="row" layout-align="start center">
                <md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="modulo">Custos</span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="titulo">Cadastros</span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent" id="titulo">Orçamento empresarial</span>
                <md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
                <span class="parent"
					  id="titulo_subtitulo">Edibição</span>
            </div>
            <!--<div class="title">Datatable</div>-->
        </div>
        <span class="h2"></span>
    </div>
    <!-- / HEADER -->

    <div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
        <!-- CONTENT -->
        <div class="content" flex>
            <div layout="row" layout-wrap>
                <div class="about" flex="100" layout="column">
                    <div class="profile-box info-box general md-whiteframe-1dp" layout="column">
                        <header class="md-accent-bg">
                            <div class="title" id="title_panel">Orçamento empresarial - Dados Gerais</div>
                        </header>

                        <div class="text-center"><img ng-if="!$ctrl.object"
													  src="../img/carregando.gif"
													  style="height: 30px;width: 30px;margin-top: 10px;margin-bottom: 10px"/></div>

                            <div ng-if="$ctrl.object">
                                <div class="white-500-bg">
                                    <form name="form" novalidate>
                                        <div flex layout="column">
                                            <div class="p-16" flex layout="column">
                                                <div layout="row" layout-sm="column" layout-wrap layout-xs="column">



                                                </div>

                                            </div>

                                        </div>


                                        <md-divider></md-divider>

                                        <div class="p-8" flex layout="row" layout-align="start start">
                                            <md-button class="md-raised md-accent" id="btn_salvar" ng-click="$ctrl.editar()" ng-disabled="form.$invalid || $ctrl.action">
                                                Editar
                                                <img ng-if="$ctrl.action"
												 src="../img/gray_carregando.gif" style="height: 20px;width: 20px;margin-top: 8px;"/>
                                                <md-tooltip class="h4">Salvar as alterações realizadas neste orçamento empresarial
                                                </md-tooltip>
                                            </md-button>

                                            <md-button class="md-raised md-accent" id="btn_cancelar" ng-click="$ctrl.retornar()" ng-disabled="!$ctrl.object || $ctrl.action">
                                                Retornar
                                                <md-tooltip class="h4">Sair deste orçamento empresarial, sem gravar as modificações
                                                    realizadas
                                                </md-tooltip>
                                            </md-button>
                                        </div>

                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- / CONTENT -->
        </div>
    </div>
