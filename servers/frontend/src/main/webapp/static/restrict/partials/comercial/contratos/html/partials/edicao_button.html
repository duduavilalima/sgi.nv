<div flex="100" layout="row" layout-align="start center">

        Salvar
        <md-tooltip id="tool_tip_btn_salvar" md-direction="bottom">
            <span class="h4">Salvar as alterações realizadas neste contrato</span>
        </md-tooltip>
    </md-button>

    <md-button class="md-raised md-accent" id="btn_cancelar" ng-click="cancelarEdit()">
        Cancelar
        <md-tooltip id="tool_tip_btn_cancelar" md-direction="bottom">
            <span class="h4">Sair deste contrato, sem gravar as modificações realizadas</span>
        </md-tooltip>
    </md-button>
</div>
