<md-dialog aria-label="Nota Fiscal - Remover: Confirmação" class="white-bg" id="dialog_titulo_popup_nota_fiscal_remover"
		   style="width: 700px;">
	<form name="dialogFrom">
		<md-toolbar class="md-accent-bg">
			<div class="md-toolbar-tools">
				<h2 id="titulo_popup_nota_fiscal_remover" md-autofocus>Nota Fiscal - Remover: Confirmação</h2>
				<span flex></span>
				<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
					<md-icon aria-label="Close dialog" md-font-icon="icon-close"
							 style="color: rgba(255,255,255,0.87) !important"></md-icon>
				</md-button>
			</div>
		</md-toolbar>
		<md-dialog-content class="md-dialog-content" id="dialog_54" role="document" tabindex="-1">
			<div class="md-dialog-content-body ng-scope" ng-if="::!dialog.mdHtmlContent">
				<p class="ng-binding" id="msg_popup_nota_fiscal_remover">Deseja realmente remover esta nota fiscal (esta
					operação não poderá ser desfeita)?</p>
			</div>
		</md-dialog-content>
		<md-dialog-actions layout="row">
			<md-button class="md-raised md-default" id="btn_confirmar_dialog_numerar" ng-click="confirm()"
					   ng-disabled="dialogFrom.$invalid || action">
				CONFIRMAR
				<img ng-show="action" src="../img/gray_carregando.gif"
					 style="height: 20px;width: 20px;margin-top: 8px;"/>
			</md-button>
			<md-button class="md-raised md-default" id="btn_cancelar_dialog_numerar" ng-click="cancel()"
					   ng-disabled="action">
				CANCELAR
			</md-button>
			<span flex></span>
		</md-dialog-actions>
	</form>
</md-dialog>
