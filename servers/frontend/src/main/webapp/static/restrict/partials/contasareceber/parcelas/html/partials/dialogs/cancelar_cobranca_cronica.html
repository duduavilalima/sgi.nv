<md-dialog aria-label="Parcela - Desmarcar cobrança crônica: Confirmação"
		   id="dialog_titulo_popup_cancelar_cobranca_cronica_parcela" style="width: 700px;">
	<form name="DialogParcelaForm">
		<md-toolbar class="md-accent-bg">
			<div class="md-toolbar-tools">
				<h2 id="titulo_popup_nota_fiscal_remocao_parcela" md-autofocus>Parcela - Desmarcar cobrança crônica:
					Confirmação</h2>
				<span flex></span>
				<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
					<md-icon aria-label="Close dialog" md-font-icon="icon-close"
							 style="color: rgba(255,255,255,0.87) !important"></md-icon>
				</md-button>
			</div>
		</md-toolbar>
		<md-dialog-content role="document">
			<div class="md-dialog-content md-dialog-content-body ng-scope">
				<p class="ng-binding" id="msg_popup_nota_fiscal_remocao_parcela">Deseja realmente desmarcar esta parcela
					como problema crônico de cobrança?</p>
			</div>
			<md-divider></md-divider>
		</md-dialog-content>

		<md-dialog-actions layout="row">
			<md-button class="md-raised md-default" id="btn_confirmar_cobranca_parcela" ng-click="confirm()"
					   ng-disabled="action">
				<img ng-show="action" src="../img/gray_carregando.gif"
					 style="height: 20px;width: 20px;margin-top: 8px;"/>
				CONFIRMAR
			</md-button>
			<md-button class="md-raised md-default" id="btn_cancelar_cobranca_parcela" ng-click="cancel()"
					   ng-disabled="action">
				CANCELAR
			</md-button>
			<span flex></span>
		</md-dialog-actions>
	</form>
</md-dialog>
