<div class="page-layout simple fullwidth">

	<!-- HEADER -->
	<div class="header md-accent-bg">
		<div layout="column" layout-align="center start">
			<div class="breadcrumb white-text" layout="row" layout-align="start center">
				<md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="modulo">Comercial</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo">Obras</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="subtitulo">Pesquisar</span>
			</div>

		</div>
		<span class="h2"></span>
	</div>
	<!-- / HEADER -->

	<!-- CONTENT -->
	<div class="content" md-background-bg>
		<div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
			<div class="content" flex>
				<!-- CAMPOS DE PESQUISA -->
				<div layout="row" layout-wrap>
					<div class="about" flex="100" layout="column">
						<div class="profile-box info-box general md-whiteframe-2dp" layout="column">
							<header class="md-accent-bg">
								<div class="title" id="titulo_filtro">Obras - Filtros de pesquisa</div>
							</header>
							<div class="content">
								<form name="form" ui-keypress="{13:'buscar(1)'}">
									<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

										<md-input-container flex flex-gt-md="50">
											<label id="lbl_nome">Nome</label>
											<input id="input_nome" name="nome" ng-model="object.nome" type="text">
										</md-input-container>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_situacao">Situação</label>
											<md-select id="combo_situacao" name="situacao"
												ng-change="$ctrl.changeSituacao()" ng-model="object.situacao">
												<md-option ng-repeat="item in $ctrl.listSituacao" ng-value="item"
													value="{{ item }}">{{ item }}
												</md-option>
											</md-select>
										</md-input-container>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_setor">Setor</label>
											<md-select id="combo_setor" name="setor" ng-change="$ctrl.changeSetor()"
												ng-model="object.setor">
												<md-option ng-repeat="item in $ctrl.listSetores" ng-value="item"
													value="{{ item }}">{{ item }}
												</md-option>
											</md-select>
										</md-input-container>
									</div>

									<div layout="row" layout-sm="column" layout-wrap layout-xs="column">


										<md-autocomplete flex flex flex-gt-md="50" id="autocomplete_cidade"
											md-delay="250" md-floating-label="Cidade" md-input-id="input_nome_cidade"
											md-input-name="autocompleteCidade" md-item-text="item.nome"
											md-items="item in querySearchCidade(searchTextCidade)"
											md-menu-class="autocomplete-custom-template" md-min-length="3"
											md-no-cache="true" md-no-cache="false" md-search-text="searchTextCidade"
											md-selected-item="selectedItemCidade"
											md-selected-item-change="selectedItemCidadeChange(item)"
											name="autocompleteCidade" value="{{ object.cidade }}">

											<md-item-template>
												<span class="item-title" style="margin-top: -20px;margin-bottom: -20px">
													<h5>
														<span md-highlight-flags="i"
															md-highlight-text="searchTextCidade">{{item.nome}}/{{item.uf}}</span>
													</h5>
												</span>
											</md-item-template>

											<div ng-messages="wizardStep1.autocompleteCidade.$error"
												ng-show="wizardStep1.autocompleteCidade.$touched" role="alert">
												<div id="msg_min_client_ciade" ng-message="minlength">O nome informado
													não é suficiente.
												</div>
												<div id="msg_max_client_cidade" ng-message="maxlength">O nome informado
													é muito longo.
												</div>
											</div>
										</md-autocomplete>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_uf">UF</label>
											<md-select id="combo_uf_dialog_cidade" name="combo_uf_dialog_cidade"
												ng-change="$ctrl.changeUf()" ng-model="object.uf">
												<md-option ng-repeat="uf in $ctrl.listEstados" ng-value="uf">{{ uf }}
												</md-option>
											</md-select>
										</md-input-container>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_tipo">Tipo</label>
											<md-select id="combo_tipo" name="tipo" ng-change="$ctrl.changeTipoObra()"
												ng-model="object.tipoObraTO">
												<md-option ng-repeat="item in $ctrl.listTipos" ng-value="item">
													{{item.nome}}
												</md-option>
											</md-select>
										</md-input-container>

									</div>

									<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

										<md-input-container flex flex-gt-md="50">
											<label id="lbl_cliente">Cliente</label>
											<input id="input_cliente" name="cliente" ng-model="object.cliente"
												type="text">
										</md-input-container>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_vigencia_de">Vigência de</label>
											<input id="vigencia_de_input" ng-model="$ctrl.object.inicioVigencia"
												tt-date-picker type="text">
										</md-input-container>

										<md-input-container flex flex-gt-md="25">
											<label id="lbl_vigencia_ate">Vigência até</label>
											<input id="vigencia_ate_input" ng-model="$ctrl.object.fimVigencia"
												tt-date-picker type="text">
										</md-input-container>

									</div>

									<section layout="row" layout-sm="row" layout-wrap>
										<div flex="30" flex-sm="10" layout="row" layout-align="start center">
											<md-button class="md-raised md-accent" id="btn_pesquisar"
												name="btn_pesquisar" ng-click="buscar()" ng-disabled="isAction">
												Pesquisar
											</md-button>
											<md-button class="md-raised md-default" id="btn_limpar" name="btn_limpar"
												ng-click="reset()" ng-disabled="isAction">
												Limpar
											</md-button>
										</div>
										<div flex="auto" layout-wrap show-gt-sm></div>
										<div flex="30" flex-sm="10" layout="row" layout-align="end center">
											<md-button class="md-raised md-default" id="btn_novaObra"
												ng-click="$ctrl.novaObra()" ng-disabled="isAction">
												Nova obra
											</md-button>

										</div>
									</section>
								</form>
							</div>
						</div>
					</div>

				</div>

				<!-- / CAMPOS DE PESQUISA -->

				<!-- DATATABLE - RESULTADO DA PESQUISA -->
				<div class="simple-table-container profile-box md-whiteframe-2dp" id="div_result"
					ng-if="result && result != undefined">
					<header class="md-accent-bg">
						<div class="title" id="titulo_resultado">Obras - Resultado da pesquisa</div>
					</header>
					<div class="sgiUiGridPesquisa" id="idGridObras" ng-if="exibirGrid(gridPesquisa)"
						ng-style="ajustarAlturaTabela(gridPesquisa)" ui-grid="gridPesquisa"
						ui-grid-auto-resize ui-grid-pinning></div>
					<div id="idMensagemPesquisa" ng-if="!exibirGrid(gridPesquisa)">
						<md-whiteframe class="md-whiteframe-1dp" flex="100" layout layout-align="center center">
							<span class="h4 p-32">{{mensagemPesquisa()}}</span>
						</md-whiteframe>
					</div>
					<section class="p-8" layout-align="space-between center" layout-wrap>
						<div></div>
						<div ng-if="exibirGrid(gridPesquisa)" ng-include="'js/util/templates/paginacao.html'">
						</div>
					</section>
				</div>
				<!-- / DATATABLE - RESULTADO DA PESQUISA -->
			</div>
		</div>
	</div>
	<!-- / CONTENT -->
</div>
