<md-dialog aria-label="Previsão de Faturamento - Carregar competência anterior" id="dialog_popup" style="width: 700px;">
	<form name="DialogConfirmarCompetenciaAnteriorForm">
		<md-toolbar class="md-accent-bg">
			<div class="md-toolbar-tools">
				<h2 id="popup" md-autofocus>Previsão de Faturamento - Carregar competência anterior</h2>
				<span flex></span>
				<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
					<md-icon aria-label="Close dialog" md-font-icon="icon-close"
							 style="color: rgba(255,255,255,0.87) !important"></md-icon>
				</md-button>
			</div>
		</md-toolbar>
		<md-dialog-content class="md-dialog-content" id="dialog_54" role="document" tabindex="-1">
			<div class="md-dialog-content-body ng-scope" ng-if="::!dialog.mdHtmlContent">
				<p class="ng-binding" id="msg_popup_nota_fiscal_cancelar">Deseja realmente carregar os valores da
					competência anterior ({{ competenciaAnterior | date:'MMMM/yyyy' }})?</p>
			</div>
		</md-dialog-content>
		<md-dialog-actions layout="row">
			<md-button class="md-raised md-default" id="btn_confirmar" ng-click="confirmar()">
				CONFIRMAR
			</md-button>
			<md-button class="md-raised md-default" id="btn_cancelar" ng-click="cancel()">
				CANCELAR
			</md-button>
			<span flex></span>
		</md-dialog-actions>
	</form>
</md-dialog>
