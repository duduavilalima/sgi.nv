<div class="content" flex ng-if="object.notaAssociadaCancelamento && object.notaAssociadaCancelamento.codigo"
	 style="margin-top: -20px;margin-bottom: -30px;">
	<div flex="100" layout layout-sm="column">
		<md-input-container flex>
			<label id="lbl_numero_nd_associada">Número da ND associada</label>
			<input id="input_numero_nd_associada" name="input_numero_nd_associada"
				   ng-disabled="true" value="{{ object.notaAssociadaCancelamento.numero }}"/>
		</md-input-container>

		<md-input-container flex>
			<label id="lbl_data_emissao">Emissão</label>
			<input id="input_data_emissao" name="input_data_emissao"
				   ng-disabled="true" value="{{ object.notaAssociadaCancelamento.dataEmissao | date:'dd/MM/yyyy' }}"/>
		</md-input-container>

		<md-input-container flex>
			<label id="lbl_associacao_nd">Associação da ND</label>
			<input id="input_associacao_nd" name="input_associacao_nd"
				   ng-disabled="true" value="{{ object.respNotaAssociadaCancelamento.nome }}"/>
		</md-input-container>

		<md-input-container flex>
			<label id="lbl_associacao_data_hora">Data/Hora</label>
			<input id="input_associacao_data_hora" name="input_associacao_data_hora"
				   ng-disabled="true"
				   value="{{ object.dataRespNotaAssociadaCancelamento | date:'dd/MM/yyyy HH:mm:ss' }}"/>
		</md-input-container>
	</div>
</div>

<div class="text-center"><img ng-show="listMotivos == null"src="../img/carregando.gif"
			  style="height: 30px;width: 30px;margin-top: 10px;margin-bottom: 10px"/></div>

<div class="content" flex ng-repeat="item in listMotivos">

	<div layout="row" layout-wrap>
		<div class="about" flex="100" layout="column">
			<div class="profile-box info-box general md-whiteframe-1dp" layout="column">
				<header class="md-accent-bg md-toolbar-tools">
					<div class="title" id="title_panel">{{item.motivoRetornoDocumento.pessoa.nome}} -
						{{item.motivoRetornoDocumento.dataCriacao | date : 'dd/MM/yyyy HH:mm:ss'}}
					</div>

					<span flex></span>

					<div class="title" layout-align="end center"
						 ng-if="item && item.motivoRetornoDocumento && item.motivoRetornoDocumento.aplicacao && item.motivoRetornoDocumento.aplicacao.chave === 'faturamento-cancelar_nd'">
						Cancelamento
					</div>
					<div class="title"
						 ng-if="item && item.motivoRetornoDocumento && item.motivoRetornoDocumento.aplicacao && item.motivoRetornoDocumento.aplicacao.chave === 'faturamento-rever_canc_nd'"
						 style="text-align: right;">
						Reversão do cancelamento
					</div>
				</header>
				<div class="padding-16">
					<div class="simple-table-container md-whiteframe-1dp">
						<table class="tabela_exibicao row-border hover md-caption tabela_exibicao"
							   id="table_motivos_{{$index}}" ms-responsive-table>
							<thead>
							<tr class="md-grey-200-bg">
								<th width="40%">Motivo</th>
								<th>Solução</th>
							</tr>
							</thead>

							<tbody>
							<tr ng-if="item.motivoRetornoDocumento.listaMotivoRetorno != null && item.motivoRetornoDocumento.listaMotivoRetorno.length > 0"
								ng-repeat="itemMotivo in item.motivoRetornoDocumento.listaMotivoRetorno">
								<td id="td_motivo_{{$index}}">{{ itemMotivo.motivoRetorno.motivo }}</td>
								<td id="td_solucao_{{$index}}">{{ itemMotivo.motivoRetorno.solucao }}</td>
							</tr>
							</tbody>

							<tbody>
							<tr ng-if="item.motivoRetornoDocumento.listaMotivoRetorno == null || item.motivoRetornoDocumento.listaMotivoRetorno.length == 0">
								<td class="text-center msg-empty-list" colspan="3">Não existem <strong>Motivos de
									Retorno</strong> informados.
								</td>
							</tr>
							</tbody>
						</table>
					</div>
					<div layout layout-sm="column" style="margin-top: 15px">
						<md-input-container flex>
							<label id="lbl_observacao_{{$index}}">Observação</label>
							<textarea columns="10" id="input_observacao_{{$index}}" name="input_observacao_{{$index}}"
									  ng-disabled="true" ng-model="item.motivoRetornoDocumento.observacao"
									  value="{{ item.motivoRetornoDocumento.observacao }}">
                            </textarea>
						</md-input-container>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
