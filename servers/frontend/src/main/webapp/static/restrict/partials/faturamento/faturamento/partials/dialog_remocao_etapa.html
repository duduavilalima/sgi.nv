<md-dialog aria-label="Etapa - Remover: Confirmação" id="dialog_titulo_popup_etapa_confirmacao_remover"
		   style="width: 700px;">
	<form name="DialogEtapaForm">
		<md-toolbar class="md-accent-bg">
			<div class="md-toolbar-tools">
				<h2 id="titulo_popup_etapa_confirmacao_remover" md-autofocus>Etapa - Remover: Confirmação</h2>
				<span flex></span>
				<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
					<md-icon aria-label="Close dialog" md-font-icon="icon-close"
							 style="color: rgba(255,255,255,0.87) !important"></md-icon>
				</md-button>
			</div>
		</md-toolbar>
		<md-dialog-content role="document">
			<div class="md-dialog-content md-dialog-content-body ng-scope">
				<p class="ng-binding" id="msg_popup_etapa_confirmacao_remover">Deseja realmente <b>remover</b> esta
					etapa (esta operação não poderá ser desfeita)?</p>
			</div>
			<md-divider></md-divider>
		</md-dialog-content>

		<md-dialog-actions layout="row">
			<md-button class="md-raised md-default" id="btn_salvar_remover_etapa" ng-click="confirm()"
					   ng-disabled="action">
				CONFIRMAR
			</md-button>
			<md-button class="md-raised md-default" id="btn_cancelar_remover_etapa" ng-click="cancel()"
					   ng-disabled="action">
				CANCELAR
			</md-button>
			<span flex></span>
		</md-dialog-actions>
	</form>
</md-dialog>
