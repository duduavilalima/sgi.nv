<div class="page-layout simple fullwidth" ng-controller="FechoDetailCtrl as $ctrl">

	<!-- HEADER -->
	<div class="header md-accent-bg">
		<div layout="column" layout-align="center start">
			<div class="breadcrumb white-text" layout="row" layout-align="start center">
				<md-icon class="white-text s16" md-font-icon="icon-home"></md-icon>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="modulo">Comercial</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo">Centros Financeiros</span>
				<md-icon class="white-text s16 separator" md-font-icon="icon-chevron-right"></md-icon>
				<span class="parent" id="titulo_subtitulo">Edição</span>
			</div>
		</div>
		<span class="h2"></span>
	</div>
	<!-- / HEADER -->

	<div class="page-layout simple single-scroll" id="profile" layout="row" layout-padding>
		<!-- CONTENT -->
		<div class="content" flex>
			<div layout="row" layout-wrap>
				<div class="about" flex="100" layout="column">
					<div class="profile-box info-box general md-whiteframe-1dp" layout="column">
						<header class="md-accent-bg">
							<div class="title" id="title_panel">Centros Financeiros - Dados Gerais</div>
						</header>
						<div>
							<div class="white-500-bg">
								<form name="CentrosFinanceirosForm" novalidate>
									<div flex layout="column">

										<div class="p-16" flex layout="column">
											<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

												<md-input-container flex flex-gt-md="50">
													<label id="lbl_gerencia_exibir">Gerência</label>
													<input id="input_gerencia_exibir" name="input_gerencia_exibir" ng-disabled="true" type="text" value="{{::$ctrl.object.pai.nome}}">
												</md-input-container>

												<md-input-container flex flex-gt-md="25">
													<label id="lbl_identificador_exibir">Identificador</label>
													<input id="input_identificador_exibir" name="input_identificador_exibir" ng-disabled="true" type="text" value="{{ $ctrl.object.varIdentificador }}">
												</md-input-container>

												<md-input-container flex flex-gt-md="25">
													<label id="lbl_situacao_exibir">Situação</label>
													<input id="input_situacao_exibir" name="input_situacao_exibir"
														   ng-disabled="true" type="text" value="{{$ctrl.object.situacao}}">
												</md-input-container>

											</div>

											<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

												<md-input-container flex flex-gt-md="50">
													<label id="lbl_nome_exibir">Nome</label>
													<input id="input_nome_exibir" name="input_nome_exibir"
														   ng-disabled="true" type="text" value="{{::$ctrl.object.nome}}">
												</md-input-container>

												<md-input-container flex flex-gt-md="50">
													<label id="lbl_eng_responsavel_exibir">Engª responsável</label>
													<input id="input_eng_responsavel_exibir"
														   name="input_eng_responsavel_exibir" ng-disabled="true"
														   type="text" value="{{::$ctrl.object.engenheiroResponsavel.nome}}">
												</md-input-container>

											</div>

											<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

												<md-input-container flex flex-gt-md="50">
													<label id="lbl_contato_aae_exibir">Contato AAE</label>
													<input id="input_contato_aae_exibir" name="input_contato_aae_exibir"
														   ng-disabled="true" type="text"
														   value="{{::$ctrl.object.contatoAA.nome}}">
												</md-input-container>

												<md-input-container flex flex-gt-md="50">
													<label id="lbl_tel_contato_exibir">Tel. contato</label>
													<input id="input_tel_contato_exibir" name="input_tel_contato_exibir"
														   ng-disabled="true" type="text" value="{{$ctrl.object.telefone}}">
												</md-input-container>

											</div>

											<div layout="row" layout-sm="column" layout-wrap layout-xs="column">

												<md-input-container flex flex-gt-md="25">
													<label id="lbl_regime_exibir">Regime</label>
													<input id="input_regime_exibir" name="input_regime_exibir"
														   ng-disabled="true" type="text"
														   value="{{ $ctrl.object.cumulativo ? 'Cumulativo' : 'Não Cumulativo' }}">
												</md-input-container>

												<md-input-container flex flex-gt-md="25">
													<label id="lbl_matriz_filial_exibir">Matriz/Filial</label>
													<input id="input_matriz_filial_exibir"
														   name="input_matriz_filial_exibir" ng-disabled="true"
														   type="text" value="{{::$ctrl.object.unidade.codnome}}">
												</md-input-container>

											</div>

										</div>

										<md-tabs md-border-bottom md-dynamic-height>
											<md-tab label="Fecho">
												<div
													 ng-include="'partials/comercial/cadastros/centrosfinanceiros/html/partials/aba_fecho.html'">
												</div>
											</md-tab>
										</md-tabs>

									</div>

									<md-divider></md-divider>

									<div class="p-8" flex layout="row" layout-align="start start" layout-xs="column"
										 ng-if="screenMode !== 'VIEW'">
										<md-button class="md-raised md-accent" id="btn_salvar" ng-click="$ctrl.salvar()" ng-disabled="CentrosFinanceirosForm.$invalid || !$ctrl.object.contatoAA">
											Salvar
											<md-tooltip id="tool_tip_btn_salvar" md-direction="bottom">
												<span
													class="h4">Salvar as alterações realizadas neste Centro Financeiro</span>
											</md-tooltip>
										</md-button>

										<md-button class="md-raised md-accent" id="btn_cancelar" ng-click="$ctrl.cancelar()">
											Cancelar
											<md-tooltip id="tool_tip_btn_cancelar" md-direction="bottom">
												<span class="h4">Sair deste Centro Financeiro, sem gravar as modificações realizadas</span>
											</md-tooltip>
										</md-button>
									</div>

								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- / CONTENT -->
	</div>
</div>
