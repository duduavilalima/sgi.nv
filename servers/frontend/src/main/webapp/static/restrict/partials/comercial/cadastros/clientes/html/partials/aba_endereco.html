<div ng-if="screenMode !== 'VIEW'">
	<div layout="row" layout-sm="column" layout-wrap
		 layout-xs="column" style="margin-top: -5px;">
		<md-input-container flex="20" flex-sm="100"
							flex-xs="100">
			<label id="lbl_cep">CEP</label>
			<input id="input_cep" mask="99999-999"
				   name="input_cep"
				   ng-model="$ctrl.object.endereco.cep"
				   required="true" restrict="reject"
				   type="text">
			<div ng-messages="ClientesForm.input_cep.$error"
				 role="alert">
				<div ng-message="required">Obrigatório.</div>
			</div>
		</md-input-container>
		<!-- Autocomplete de Cidade-->
		<md-autocomplete flex flex
						 flex-gt-md="60"
						 id="autocomplete_cidade"
						 md-delay="250"
						 md-floating-label="Cidade"
						 md-input-id="input_nome_cidade"
						 md-input-maxlength="100"
						 md-input-minlength="3"
						 md-input-name="autocompleteCidade"
						 md-item-text="item.nome"
						 md-items="item in $ctrl.querySearchCidade(searchTextCidade)"
						 md-menu-class="autocomplete-custom-template"
						 md-min-length="3"
						 md-no-cache="true"
						 md-no-cache="false"
						 md-require-match="true"
						 md-search-text="searchTextCidade"
						 md-selected-item="selectedItemCidade"
						 md-selected-item-change="$ctrl.selectedItemCidadeChange(item)"
						 name="autocompleteCidade"
						 required="true"
						 value="{{ $ctrl.object.endereco.cidade }}">

			<md-item-template>
																			<span class="item-title"
																				  style="margin-top: -20px;margin-bottom: -20px">
																						<h5>
																							<span md-highlight-flags="i"
																								  md-highlight-text="searchTextCidade">{{item.nome}}/{{item.uf}}</span>
																						</h5>
																					</span>
			</md-item-template>

			<div
				ng-messages="ClientesForm.autocompleteCidade.$error"
				ng-show="ClientesForm.autocompleteCidade.$touched"
				role="alert">
				<div ng-message="required">Obrigatório.</div>
				<div id="msg_min_client_cidade"
					 ng-message="minlength">O nome informado não
					é suficiente.
				</div>
				<div id="msg_max_client_cidade"
					 ng-message="maxlength">O nome informado é
					muito longo.
				</div>
				<div ng-message="md-require-match">A cidade
					informada não é válida.
				</div>
			</div>
		</md-autocomplete>

		<md-input-container flex="20" flex-sm="100"
							flex-xs="100">
			<label id="lbl_uf">UF</label>
			<input id="input_uf" name="input_uf"
				   ng-disabled="true" type="text"
				   value="{{$ctrl.object.endereco.uf}}">
		</md-input-container>
	</div>

	<div layout="row" layout-sm="column" layout-wrap
		 layout-xs="column">

		<md-input-container flex="20" flex-sm="100"
							flex-xs="100">
			<label id="lbl_tipoLogradouro">Tipo de logradouro</label>
			<md-select id="combo_tipoLogradouro"
					   name="tipoLogradouro"
					   ng-model="$ctrl.object.endereco.tipoLogradouro"
					   ng-model-options="{trackBy: '$value.codigo'}">
				<md-option
					ng-repeat="item in listTipoLogradouro"
					ng-value="item" value="{{ item }}">{{
					item.nome }}
				</md-option>
			</md-select>
		</md-input-container>

		<md-input-container flex="60" flex-sm="100"
							flex-xs="100">
			<label id="lbl_endereco">Logradouro</label>
			<input id="input_endereco" name="input_endereco"
				   ng-model="$ctrl.object.endereco.endereco"
				   required="true"
				   style="text-transform: uppercase;"
				   type="text">
			<div
				ng-messages="ClientesForm.input_endereco.$error"
				role="alert">
				<div ng-message="required">Obrigatório.</div>
			</div>
		</md-input-container>

		<md-input-container flex="20" flex-sm="100"
							flex-xs="100">
			<label id="lbl_numero">Nº</label>
			<input id="input_numero" name="input_uf"
				   ng-model="$ctrl.object.endereco.numero"
				   type="text">
		</md-input-container>
	</div>

	<div layout="row" layout-sm="column" layout-wrap
		 layout-xs="column">

		<md-input-container flex="50" flex-sm="100"
							flex-xs="100">
			<label id="lbl_bairro">Bairro</label>
			<input id="input_bairro" name="input_bairro"
				   ng-model="$ctrl.object.endereco.bairro"
				   style="text-transform: uppercase;"
				   type="text">
		</md-input-container>

		<md-input-container flex="50" flex-sm="100"
							flex-xs="100">
			<label id="lbl_complemento">Complemento</label>
			<input id="input_complemento"
				   name="input_complemento"
				   ng-model="$ctrl.object.endereco.complemento"
				   style="text-transform: uppercase;"
				   type="text">
		</md-input-container>
	</div>
</div>
