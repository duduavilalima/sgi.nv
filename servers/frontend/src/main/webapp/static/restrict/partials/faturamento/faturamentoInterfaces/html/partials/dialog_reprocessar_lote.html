<md-dialog aria-label="Lote - Reprocessar: Confirmação" id="dialog_titulo_popup_lote_reprocessar" style="width: 700px;">
	<form name="DialogControllerReprocessarLote">
		<md-toolbar class="md-accent-bg">
			<div class="md-toolbar-tools">
				<h2 id="titulo_popup_lote_reprocessar" md-autofocus>Lote - Reprocessar: Confirmação</h2>
				<span flex></span>
				<md-button class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
					<md-icon aria-label="Close dialog" md-font-icon="icon-close"
							 style="color: rgba(255,255,255,0.87) !important"></md-icon>
				</md-button>
			</div>
		</md-toolbar>

		<md-dialog-content id="dialog_54" role="document" tabindex="-1">
			<div class="md-dialog-content md-dialog-content-body ng-scope">
				<p class="ng-binding" id="msg_popup_lote_reprocessar">Deseja realmente <b>reprocessar</b> o lote
					selecionado?</p>
			</div>
			<md-divider></md-divider>
		</md-dialog-content>

		<md-dialog-actions class="navigation padding-8" layout="row">
			<md-button class="md-raised md-default" id="btn_confirmar_reprocessar_lote" ng-click="confirm()"
					   ng-disabled="action">
				CONFIRMAR
			</md-button>
			<md-button class="md-raised md-default" id="btn_cancelar_reprocessar_lote" ng-click="cancel()"
					   ng-disabled="action">
				CANCELAR
			</md-button>
			<span flex></span>
		</md-dialog-actions>
	</form>
</md-dialog>
