# Executa os WARs rest e frontend em Tomcat, usando o Postgres e o MailHog que rodam no host.
# Pré-requisito: mvn package -DskipTests (gera servers/*/target/*.war). Variáveis lidas do .env.
# Uso: docker compose -f docker-compose.web.yml up --build
x-web: &web
  build:
    context: .
    dockerfile: docker/web/Dockerfile
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-env: &env
  DB_HOST: host.docker.internal
  MAIL_HOST: host.docker.internal
  JAVA_OPTS: >-
    -Ddb.host=host.docker.internal -Ddb.port=${DB_PORT:-5432} -Ddb.name=${DB_NAME}
    -Ddb.username=${DB_USER} -Ddb.password=${DB_PASS}

services:
  rest:
    <<: *web
    environment: *env
    ports:
      - "8081:8080"
    volumes:
      - "./servers/rest/target/rest-5.13.6.war:/usr/local/tomcat/webapps/sgi#rest.war:ro"

  frontend:
    <<: *web
    environment: *env
    ports:
      - "8080:8080"
    volumes:
      - "./servers/frontend/target/frontend-5.13.6.war:/usr/local/tomcat/webapps/sgi#nv.war:ro"
